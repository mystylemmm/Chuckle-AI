<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>MY AI 3.2</title>
<style>
*{box-sizing:border-box} html,body{margin:0;padding:0;background:#000;color:#fff;font-family:Arial,sans-serif;height:100%;height:100dvh}
body{display:flex;overflow:hidden}
.sidebar{width:260px;min-width:260px;background:#171717;padding:14px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.sidebar h2{margin:0;font-size:22px} .menu{padding:10px;border-radius:10px;cursor:pointer;color:#ccc;font-size:14px}
.menu:hover{background:#2a2a2a;color:#fff}
.newchat{background:#4a6cff;border:0;color:#fff;padding:12px;border-radius:20px;font-weight:bold;cursor:pointer;margin-top:10px}
.keybox{width:100%;background:#222;border:1px solid #333;color:#fff;padding:10px;border-radius:10px;font-size:14px;margin-top:6px}
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:#000}
.topbar{display:flex;justify-content:center;padding:10px;gap:6px}
.pill{background:#222;border-radius:20px;padding:4px;display:flex;gap:4px}
.pill button{border:0;background:transparent;color:#aaa;padding:8px 16px;border-radius:16px;cursor:pointer;font-size:14px}
.pill button.active{background:#333;color:#fff}
.chat{flex:1;overflow-y:auto;padding:16px;max-width:800px;margin:0 auto;width:100%}
.msg{margin:12px 0;white-space:pre-wrap;line-height:1.6;font-size:16px;word-wrap:break-word} .me{color:#7cc4ff} .ai{color:#fff}
.msg pre{background:#111;border:1px solid #333;padding:10px;border-radius:8px;overflow-x:auto;white-space:pre;margin:8px 0;font-size:13px}
.msg code{font-family:monospace;background:#222;padding:1px 4px;border-radius:4px;font-size:.92em}
.msg pre code{background:none;padding:0}
.center{text-align:center;margin-top:40px;color:#ccc}
.center div{margin:12px auto;padding:14px;background:#171717;border-radius:14px;max-width:400px;cursor:pointer;font-size:16px}
img.gen,video.gen{max-width:100%;border-radius:12px;margin-top:10px}
.item{padding:10px;background:#171717;border-radius:10px;margin:6px 0;font-size:14px;display:flex;gap:8px;align-items:center}
.item span{flex:1;cursor:pointer}
.item button{background:#333;color:#ccc;border:0;border-radius:8px;padding:6px 10px}
.inputwrap{max-width:800px;margin:0 auto 10px;width:calc(100% - 20px);padding-bottom:env(safe-area-inset-bottom)}
.inputbar{background:#222;border-radius:28px;display:flex;align-items:center;padding:6px 8px;gap:6px;border:1px solid #333}
.inputbar input{flex:1;background:transparent;border:0;color:#fff;outline:none;font-size:16px;padding:12px;min-width:0}
.inputbar button{border:0;border-radius:50%;width:40px;height:40px;cursor:pointer;background:#444;color:#fff;font-size:18px;flex-shrink:0}
.extra{display:flex;gap:6px;max-width:800px;margin:0 auto 10px;width:calc(100% - 20px)}
.extra button{flex:1;background:#171717;color:#ccc;border:0;padding:9px 2px;border-radius:12px;font-size:11px}
@media(max-width:700px){.sidebar{display:none}}
@media(min-width:900px){.chat{max-width:900px} .sidebar{width:300px;min-width:300px}}
</style>
</head>
<body>
<div class="sidebar">
<h2>MY AI</h2>
<div class="menu" onclick="showPage('images')">🖼️ Images</div>
<div class="menu" onclick="showPage('library')">📚 Library</div>
<div class="menu" onclick="showPage('settings')">⚙️ Customize</div>
<div class="menu" onclick="showPage('projects')">📁 Projects</div>
<div class="menu" onclick="showPage('explore')">🌍 Explore</div>
<hr style="border-color:#333;width:100%">
<b>Chats</b>
<div id="history"></div>
<button class="newchat" onclick="newChat()">＋ Chat</button>
<p style="font-size:12px;color:#888;margin:14px 0 0">Gemini API Key (FREE):</p>
<input class="keybox" id="geminiKey" type="text" placeholder="Paste FREE Gemini key here" autocomplete="on" spellcheck="false" onchange="saveKey(this.value)">
<p style="font-size:12px;color:#888">1. Go to aistudio.google.com<br>2. Get API Key FREE<br>3. Paste here</p>
</div>
<div class="main">
<div class="topbar"><div class="pill">
<button class="active" id="btnChat" onclick="setMode('chat')">Chat</button>
<button id="btnImage" onclick="setMode('image')">✦ Image</button>
<button id="btnVideo" onclick="setMode('video')">🎬 Animate</button>
</div></div>
<div class="chat" id="chat"></div>
<div class="inputwrap"><div class="inputbar">
<button onclick="openPDF()">＋</button>
<input type="file" id="fileIn" hidden accept="text/*,.json,.md,.csv,.py,.js,.html" onchange="handleFile(this)">
<input id="inp" type="text" placeholder="Ask MY AI..." autocomplete="on" autocorrect="on" autocapitalize="sentences" spellcheck="true" enterkeyhint="send" onkeydown="if(event.key==='Enter')send()">
<button onclick="startVoice()">🎤</button>
<button onclick="send()" style="background:#4a6cff">↑</button>
</div></div>
<div class="extra">
<button onclick="newChat()">＋ New</button>
<button onclick="openPDF()">📎 File</button>
<button onclick="showPage('library')">📚 Chats</button>
<button onclick="showPage('images')">🖼️ Gallery</button>
<button onclick="showPage('settings')">⚙️ Key</button>
<button onclick="exportChat()">📤 Export</button>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function store(k,d){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d));}catch(e){return d;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
const PHS={chat:'Ask MY AI...',image:'Describe an image...',video:'Describe a short clip...'};
let mode='chat',fileText='',cur=null,view='chat',chats=store('chats',[]);
$('geminiKey').value=localStorage.getItem('gemini')||'';
function saveKey(v){localStorage.setItem('gemini',v.trim());$('geminiKey').value=v.trim();}
const WELCOME='<div class="center" id="welcome"><h2 style="color:#fff">What can I help with?</h2>'+
'<div onclick="quick(\'Start a voice chat\')">🎧 Talk to MY AI</div>'+
'<div onclick="quick(\'Create an image of a cute cat astronaut\')">🖼️ Create an image or sticker</div>'+
'<div onclick="quick(\'Write a funny story about Ronaldo and Messi\')">✏️ Write or edit</div>'+
'<div onclick="quick(\'Make a video of a flying dragon\')">🎬 Animate an image (zoom clip)</div></div>';

function md(s){s=esc(s);
s=s.replace(/```(\w*)\n?([\s\S]*?)```/g,(m,l,c)=>'<pre><code>'+c+'</code></pre>');
s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>');
s=s.replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');return s;}
function setAI(el,t){el.innerHTML='<b>MY AI:</b> '+md(t);}
function scroll(){$('chat').scrollTop=$('chat').scrollHeight;}
function addMsg(t,who){let w=$('welcome');if(w)w.remove();let d=document.createElement('div');d.className='msg '+who;if(who==='me')d.textContent='You: '+t;else setAI(d,t);$('chat').appendChild(d);scroll();return d;}
function addImg(u){let i=document.createElement('img');i.className='gen';i.src=u;$('chat').appendChild(i);return i;}

function C(){if(!cur)cur={id:Date.now(),title:'',conv:[],log:[]};return cur;}
function persist(){if(!cur||!cur.log.length)return;chats=chats.filter(c=>c.id!==cur.id);chats.unshift(cur);chats=chats.slice(0,40);save('chats',chats);renderHistory();}
function renderHistory(){$('history').innerHTML=chats.slice(0,8).map(c=>'<div class="menu" onclick="openChat('+c.id+')">💬 '+esc((c.title||'Untitled').slice(0,28))+'</div>').join('');}
function openChat(id){let c=chats.find(x=>x.id===id);if(!c)return;cur=c;fileText='';view='chat';$('chat').innerHTML='';c.log.forEach(m=>m.w==='img'?addImg(m.t):addMsg(m.t,m.w));scroll();}
function newChat(){cur=null;fileText='';view='chat';$('chat').innerHTML=WELCOME;renderHistory();}
function delChat(id){chats=chats.filter(c=>c.id!==id);if(cur&&cur.id===id)cur=null;save('chats',chats);renderHistory();showPage('library');}
function backToChat(){if(view==='page'){cur?openChat(cur.id):newChat();}}

function setMode(m){mode=m;['btnChat','btnImage','btnVideo'].forEach(id=>$(id).classList.remove('active'));$(m==='chat'?'btnChat':m==='image'?'btnImage':'btnVideo').classList.add('active');$('inp').placeholder=PHS[m];$('inp').focus();}
function quick(t){if(t==='Start a voice chat'){startVoice();return;}setMode(t.includes('image')?'image':t.includes('video')?'video':'chat');$('inp').value=t;send();}

async function send(){
let text=$('inp').value.trim();if(!text)return;$('inp').value='';
backToChat();let c=C();if(!c.title)c.title=text.slice(0,40);
addMsg(text,'me');c.log.push({w:'me',t:text});persist();
if(mode==='image')return makeImage(text);
if(mode==='video')return makeVideo(text);
let key=(localStorage.getItem('gemini')||'').trim();
if(!key){addMsg('Tap ⚙️ Key below and paste your FREE Gemini key (from aistudio.google.com).','ai');return;}
let prompt=text;if(fileText){prompt='File content:\n'+fileText+'\n\n'+text;fileText='';}
c.conv.push({role:'user',parts:[{text:prompt}]});
let loading=addMsg('Thinking...','ai');
try{
let hist=c.conv.slice(-30);while(hist.length&&hist[0].role!=='user')hist.shift();
let r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({contents:hist})});
let j=await r.json();
let ans=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');
if(!ans)throw new Error(j.error?.message||'Empty reply - check Gemini key');
c.conv.push({role:'model',parts:[{text:ans}]});setAI(loading,ans);c.log.push({w:'ai',t:ans});
}catch(e){c.conv.pop();setAI(loading,'Error - '+e.message);}
persist();scroll();}

function makeImage(prompt){
let c=C();let loading=addMsg('Making your image... FREE, wait a few seconds','ai');
const mk=()=>'https://image.pollinations.ai/prompt/'+encodeURIComponent(prompt)+'?width=1024&height=1024&nologo=true&seed='+Date.now();
let url=mk(),tries=0,img=document.createElement('img');img.className='gen';
img.onload=()=>{setAI(loading,'Here is your image! Long press to save.');c.log.push({w:'img',t:url});let g=store('gallery',[]);g.unshift(url);save('gallery',g.slice(0,50));persist();scroll();};
img.onerror=()=>{if(tries<1){tries++;url=mk();img.src=url;return;}img.remove();setAI(loading,'Image failed. Check internet and try again.');};
img.src=url;$('chat').appendChild(img);}

function makeVideo(prompt){
let loading=addMsg('Making a short zoom clip (FREE)... photo first, then animating it!','ai');
if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream){setAI(loading,'Video is not supported on this device.');return;}
let url='https://image.pollinations.ai/prompt/'+encodeURIComponent(prompt)+'?width=1024&height=1024&nologo=true&seed='+Date.now();
let img=new Image();img.crossOrigin='anonymous';
img.onerror=()=>setAI(loading,'Image failed. Check internet and try again.');
img.onload=()=>{try{
let c=document.createElement('canvas');c.width=720;c.height=720;let ctx=c.getContext('2d');
let stream=c.captureStream(30);let opts=MediaRecorder.isTypeSupported('video/webm')?{mimeType:'video/webm'}:undefined;
let rec=new MediaRecorder(stream,opts);let chunks=[];
rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
rec.onstop=()=>{let v=document.createElement('video');v.className='gen';v.controls=true;v.autoplay=true;v.loop=true;v.muted=true;v.src=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));$('chat').appendChild(v);setAI(loading,'Your clip is ready! Long press to save (clips are not kept in chat history).');scroll();};
rec.start();let f=0;
let timer=setInterval(()=>{f++;let z=1+f*0.002;ctx.save();ctx.translate(360,360);ctx.scale(z,z);ctx.drawImage(img,-360,-360,720,720);ctx.restore();ctx.fillStyle='white';ctx.font='bold 26px Arial';ctx.fillText(prompt.slice(0,35),20,700);if(f>150){clearInterval(timer);rec.stop();}},33);
}catch(e){setAI(loading,'Video error - '+e.message);}};
img.src=url;}

window.onVoice=t=>{$('inp').placeholder=PHS[mode];$('inp').value=t;send();};
window.onVoiceError=m=>{$('inp').placeholder=PHS[mode];addMsg('Voice: '+m,'ai');};
function startVoice(){
if(window.Android&&Android.startVoice){$('inp').placeholder='Listening...';Android.startVoice();return;}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){alert('Voice is not supported here. Tap the 🎤 on your keyboard instead.');$('inp').focus();return;}
let rec=new SR();rec.lang='en-US';rec.onresult=e=>{$('inp').value=e.results[0][0].transcript;send();};rec.onerror=()=>alert('Voice failed. Use the 🎤 on your keyboard instead.');rec.start();}

function showPage(p){
view='page';let c=$('chat');
if(p==='images'){let g=store('gallery',[]);c.innerHTML='<h3>🖼️ Gallery</h3>'+(g.length?'':'No images yet');g.forEach(u=>{let i=document.createElement('img');i.src=u;i.style.cssText='width:100%;border-radius:12px;margin:6px 0';c.appendChild(i);});}
if(p==='settings'){c.innerHTML='<h3>⚙️ Settings</h3><p>Gemini API key (FREE from aistudio.google.com):</p><input class="keybox" id="geminiKey2" type="text" placeholder="Paste FREE Gemini key here" spellcheck="false"><p id="keyStatus" style="color:#7aa2ff"></p><p style="font-size:12px;color:#888">The key is stored only on this device.</p>';let k=$('geminiKey2');k.value=localStorage.getItem('gemini')||'';k.onchange=()=>{saveKey(k.value);$('keyStatus').textContent='Saved ✔';};}
if(p==='library'){c.innerHTML='<h3>📚 Chats</h3>'+(chats.length?'':'Nothing yet');chats.forEach(x=>{let d=document.createElement('div');d.className='item';let s=document.createElement('span');s.textContent=x.title||'Untitled';s.onclick=()=>openChat(x.id);let b=document.createElement('button');b.textContent='✕';b.onclick=()=>delChat(x.id);d.append(s,b);c.appendChild(d);});}
if(p==='projects')c.innerHTML='<h3>📁 Projects</h3><p>Your chats + images are saved on this device.</p>';
if(p==='explore')c.innerHTML='<h3>🌍 Explore</h3><p>Try: Draw Ronaldo funny, Make a story, Homework help, Business idea</p>';}

function handleFile(el){let f=el.files[0];if(!f)return;if(f.size>200000){addMsg('File too big (max 200 KB). Only text files are supported.','ai');el.value='';return;}
let r=new FileReader();r.onload=()=>{fileText=String(r.result).slice(0,30000);backToChat();addMsg('You uploaded: '+f.name+' - now ask MY AI about it','me');};r.onerror=()=>addMsg('Could not read that file.','ai');r.readAsText(f);el.value='';}
function openPDF(){$('fileIn').click();}
function exportChat(){if(!cur||!cur.log.length)return;let t=cur.log.map(m=>(m.w==='me'?'You: ':m.w==='ai'?'MY AI: ':'[image] ')+m.t).join('\n\n');
if(navigator.share){navigator.share({title:'my-ai-chat',text:t}).catch(()=>{});return;}
let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));a.download='my-ai-chat.txt';a.click();}
newChat();
</script>
</body>
</html>
